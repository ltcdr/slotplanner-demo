name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p ci_artifacts coverage/htmlcov
          pytest -vv \
            --html=ci_artifacts/report.html \
            --self-contained-html \
            --junitxml=ci_artifacts/junit.xml \
            --cov=demo \
            --cov-report=html:coverage/htmlcov \
            --cov-report=xml:coverage/coverage.xml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            ci_artifacts/report.html
            ci_artifacts/junit.xml
            coverage/coverage.xml
            coverage/htmlcov/
